{% extends "base.html" %}

{% block title %}Delete {{ recipe.title }} - Dinner Bell{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 2rem auto; text-align: center;">
  <h2>Delete Recipe</h2>
  <p style="margin: 1.5rem 0; font-size: 1.125rem;">
    Are you sure you want to delete <strong>"{{ recipe.title }}"</strong>?
  </p>
  <p style="color: #666; margin-bottom: 2rem;">This action cannot be undone.</p>
  <form method="post" style="display: flex; gap: 1rem; justify-content: center;">
    {% csrf_token %}
    <a href="{% url 'recipe_detail' recipe.pk %}" class="btn btn-secondary">Cancel</a>
    <button type="submit" class="btn btn-danger">Delete</button>
  </form>
</div>
{% endblock %}
